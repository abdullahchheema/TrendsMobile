name: covison-offline
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: covison
      POSTGRES_USER: covison
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 setup_local.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covison -d covison"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [local]
  web:
    build: .
    image: covison/offline:development
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: covison
      DATABASE_USER: covison
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - files:/data
      - ./imports:/imports:ro
      - ./backups:/backups
    depends_on:
      db: {condition: service_healthy}
    networks: [local]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${COVISON_BIND_ADDRESS:-127.0.0.1}:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_healthy}
    networks: [local,edge]
networks:
  local:
    internal: true
  edge: {}
volumes:
  database:
  files:
