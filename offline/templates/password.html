{% extends 'base.html' %}{% block content %}<div class="page-head"><h1>My account</h1></div>
<form method="post" action="{% url 'display_name' %}" class="panel"><h2 style="margin-top:0">My name</h2><p class="muted">This name is shown at the top of every page. Your sign-in name ({{ user.get_username }}) stays the same.</p><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><div class="field"><label for="my-name">Name</label><input id="my-name" name="name" value="{{ who_name }}" maxlength="150" required></div><div class="form-actions"><button class="primary">Save name</button></div></form>
<form method="post" class="panel"><h2 style="margin-top:0">Change password</h2>{% csrf_token %}{{ form.as_p }}<button class="primary">Change password</button></form>{% endblock %}
