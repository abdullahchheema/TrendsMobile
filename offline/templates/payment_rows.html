{{ cash_modes|json_script:'cash-payment-modes' }}
<div class="table-scroll"><table><thead><tr><th>Method</th><th>Settlement PKR</th><th>Reference</th></tr></thead><tbody data-payment-rows><tr><td><select name="payment_mode" aria-label="Payment method">{% for mode in methods %}<option>{{ mode }}</option>{% endfor %}</select></td><td><label>Applied to invoice<input name="payment_amount" type="number" min="0" step="0.01"></label><input type="hidden" name="payment_cash_value" value=""><div data-cash-input><label>Cash handed<input name="payment_tendered" type="number" min="0" step="0.01" placeholder="Blank = exact applied amount"></label><p>Change: <output data-cash-change aria-live="polite">PKR 0.00</output></p></div></td><td><input name="payment_reference" aria-label="Transaction reference"><button type="button" data-remove-payment>Remove</button></td></tr></tbody></table></div>
<button type="button" data-add-payment>Add split payment</button><p data-payment-summary role="status" aria-live="polite"></p>
<p class="muted">Applied amounts reduce the invoice balance. Enter cash handed only for cash; change is calculated separately. Leave all payment fields blank for a credit sale.</p>
