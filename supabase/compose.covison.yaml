name: covison-supabase
services:
  studio:
    container_name: covison-supabase-studio
    environment:
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
  api-gw:
    container_name: covison-supabase-gateway
    ports: !override
      - "${COVISON_BIND_ADDRESS:-127.0.0.1}:${COVISON_API_PORT:-8765}:8000"
    networks:
      default:
        aliases: [envoy, kong]
      lan: {}
  db:
    container_name: covison-supabase-db
    volumes:
      - ../migrations:/covison-migrations:ro
  auth:
    container_name: covison-supabase-auth
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
  rest:
    container_name: covison-supabase-rest
  realtime:
    # The realtime-dev tenant prefix is required by the upstream service.
    container_name: realtime-dev.covison-supabase-realtime
    environment:
      API_JWT_JWKS: ${JWT_JWKS}
  storage:
    container_name: covison-supabase-storage
    volumes: !override
      - storage-data:/var/lib/storage
    environment:
      JWT_JWKS: ${JWT_JWKS}
      FILE_SIZE_LIMIT: 10485760
  imgproxy:
    container_name: covison-supabase-imgproxy
    volumes: !override
      - storage-data:/var/lib/storage
  meta:
    container_name: covison-supabase-meta
  functions:
    container_name: covison-supabase-functions
    profiles: [optional]
    environment:
      SUPABASE_JWKS: ${JWT_JWKS}
  supavisor:
    container_name: covison-supabase-pooler
    profiles: [optional]
    ports: !reset []
  crm-web:
    build:
      context: ../../offline
    image: covison/erp-supabase:development
    container_name: covison-supabase-crm
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${COVISON_DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_HOST: db
      DATABASE_NAME: postgres
      DATABASE_USER: covison_app
      DATABASE_PASSWORD: ${COVISON_APP_DB_PASSWORD}
      DATABASE_SCHEMA: covison_app
      TEST_DATABASE_NAME: test_covison_supabase
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      COVISON_CRM_OWNER_EMAIL: ${COVISON_CRM_OWNER_EMAIL}
      COVISON_CRM_OWNER_PASSWORD: ${COVISON_CRM_OWNER_PASSWORD}
    volumes:
      - ../../offline/imports:/imports:ro
    depends_on:
      db: {condition: service_healthy}
      auth: {condition: service_healthy}
      api-gw: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  crm-proxy:
    image: nginx:stable-alpine
    container_name: covison-supabase-crm-proxy
    restart: unless-stopped
    ports:
      - "${COVISON_BIND_ADDRESS:-127.0.0.1}:8081:80"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      crm-web: {condition: service_healthy}
    networks: [default,lan]
  crm-qa:
    image: covison/erp-supabase:development
    profiles: [qa]
    user: "0:0"
    environment:
      DJANGO_SECRET_KEY: ${COVISON_DJANGO_SECRET_KEY}
      DATABASE_HOST: db
      DATABASE_NAME: postgres
      DATABASE_USER: supabase_admin
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SCHEMA: public
      TEST_DATABASE_NAME: test_covison_supabase
      SUPABASE_INTERNAL_URL: ""
    volumes:
      - ../../offline/imports:/imports:ro
    entrypoint: ["python","manage.py","test","shop","--noinput","-v","2"]
networks:
  default:
    internal: true
  lan: {}
volumes:
  storage-data:
