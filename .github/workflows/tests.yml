name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: covison
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: covison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U covison" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_HOST: localhost
      DATABASE_PASSWORD: ci-password
    defaults:
      run:
        working-directory: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: offline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect static files (manifest storage must build)
        run: python manage.py collectstatic --noinput
      - name: Contrast check of the design tokens
        run: python ../scripts/check_contrast.py
      - name: Django tests (real Postgres, including the concurrency tests)
        run: python manage.py test shop --parallel 1
